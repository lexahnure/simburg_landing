<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Соти з конічним градієнтом та зміною іконок</title>
  
  <!-- Fonts (з системними фолбеками для повної офлайн-роботи) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --bg-deep: #071738;
      --bg-mid: #0a204e;
      --bg-card: rgba(10, 28, 68, 0.75);
      --border-subtle: rgba(64, 128, 255, 0.2);
      --border-glow: rgba(0, 229, 255, 0.4);
      --text-primary: #e6f1ff;
      --text-secondary: #88a4d4;
      --accent-cyan: #00f0ff;
      --accent-blue: #005ce2;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-sans);
      background: radial-gradient(circle at 70% 50%, #0d2a6b 0%, #071738 70%, #040e24 100%);
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #honeycomb-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: crosshair;
    }

    /* Header & Telemetry */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 32px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      padding: 10px 18px;
      border-radius: 9999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 16px var(--accent-cyan); }
    }

    .brand .title {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--text-primary);
    }

    .brand .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: #00ffaa;
      background: rgba(0, 255, 170, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 255, 170, 0.25);
    }

    .telemetry {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: var(--bg-card);
      padding: 8px 16px;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .telemetry-item .label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .telemetry-item .value {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent-cyan);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    /* Hint Toast */
    .hint-toast {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(7, 23, 56, 0.85);
      border: 1px solid rgba(64, 128, 255, 0.25);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12.5px;
      color: var(--text-secondary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
      animation: fade-pulse 4s infinite ease-in-out;
    }

    @keyframes fade-pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Bottom Controls Dock */
    .controls-dock {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
    }

    .dock-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .control-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 240, 255, 0.3);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-btn.primary {
      background: var(--accent-blue);
      border-color: #3b82f6;
      color: #ffffff;
    }

    .control-btn.primary:hover {
      background: #1d4ed8;
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 20px rgba(29, 78, 216, 0.6);
    }

    .btn-svg {
      width: 18px;
      height: 18px;
    }

    .hidden {
      display: none !important;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Slider */
    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }

    .slider-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 5px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      outline: none;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-cyan);
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .slider-val {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      min-width: 32px;
    }

    /* Icon Pills */
    .icon-pills {
      display: flex;
      gap: 6px;
      max-width: 540px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .icon-pills::-webkit-scrollbar {
      height: 3px;
    }

    .icon-pills::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.25);
      border-radius: 3px;
    }

    .icon-pill {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .icon-pill:hover {
      background: rgba(0, 240, 255, 0.1);
      border-color: rgba(0, 240, 255, 0.3);
      color: var(--text-primary);
    }

    .icon-pill.active {
      background: rgba(0, 92, 226, 0.4);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .icon-pills {
        max-width: 220px;
      }
      .telemetry-item:last-child {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Main Canvas -->
    <canvas id="honeycomb-canvas"></canvas>

    <!-- Top Status Overlay -->
    <header class="top-bar">
      <div class="brand">
        <span class="status-indicator"></span>
        <span class="title">HEX-CELL PULSE</span>
        <span class="badge">9 ICONS ACTIVE</span>
      </div>
      <div class="telemetry">
        <div class="telemetry-item">
          <span class="label">ОБЕРТИ</span>
          <span class="value" id="revolution-count">0</span>
        </div>
        <div class="telemetry-item">
          <span class="label">АКТИВНА ІКОНКА</span>
          <span class="value" id="current-icon-name">CAR (АВТО)</span>
        </div>
        <div class="telemetry-item">
          <span class="label">КУТ</span>
          <span class="value" id="angle-display">000°</span>
        </div>
      </div>
    </header>

    <!-- Hint overlay -->
    <div class="hint-toast">
      <span>💡 Клікніть на будь-яке коло сот, щоб перенести активну зону</span>
    </div>

    <!-- Bottom Interactive Controls Dock -->
    <footer class="controls-dock">
      <div class="dock-inner">
        <!-- Play / Pause -->
        <button id="btn-toggle" class="control-btn primary" title="Пауза / Старт (Пробіл)">
          <svg id="icon-pause" class="btn-svg" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
          </svg>
          <svg id="icon-play" class="btn-svg hidden" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6,4 20,12 6,20"></polygon>
          </svg>
        </button>

        <!-- Previous Icon -->
        <button id="btn-prev" class="control-btn" title="Попередня іконка">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <!-- Next Icon -->
        <button id="btn-next" class="control-btn" title="Наступна іконка">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="divider"></div>

        <!-- Speed control (default 0.5x) -->
        <div class="slider-group">
          <span class="slider-label">ШВИДКІСТЬ</span>
          <input type="range" id="speed-slider" min="0.2" max="3" step="0.1" value="0.5" title="Швидкість обертання">
          <span class="slider-val" id="speed-display">0.5x</span>
        </div>

        <div class="divider"></div>

        <!-- Icon selection indicators -->
        <div class="icon-pills" id="icon-pills-container">
          <!-- Dynamically populated -->
        </div>

        <div class="divider"></div>

        <!-- Center active cell -->
        <button id="btn-center" class="control-btn" title="Відцентрувати активне коло">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M3 12h3m12 0h3M12 3v3m0 12v3"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script>
    /**
     * Hexagonal Honeycomb Canvas Animation with Conic-Gradient Dashed Ring
     * & Dynamic Icon Carousel on each rotation (9 custom icons).
     */
    (function () {
      'use strict';

      const canvas = document.getElementById('honeycomb-canvas');
      const ctx = canvas.getContext('2d');

      const revolutionEl = document.getElementById('revolution-count');
      const currentIconEl = document.getElementById('current-icon-name');
      const angleDisplayEl = document.getElementById('angle-display');
      const btnToggle = document.getElementById('btn-toggle');
      const iconPause = document.getElementById('icon-pause');
      const iconPlay = document.getElementById('icon-play');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnCenter = document.getElementById('btn-center');
      const speedSlider = document.getElementById('speed-slider');
      const speedDisplay = document.getElementById('speed-display');
      const pillsContainer = document.getElementById('icon-pills-container');

      // 9 Vector Icons
      const ICONS = [
        { id: 'car', name: 'CAR (АВТО)', shortName: 'Авто', color: '#0070f3', draw: drawCar },
        { id: 'camera', name: 'CCTV CAMERA (КАМЕРА)', shortName: 'Камера', color: '#0088ff', draw: drawCCTV },
        { id: 'card', name: 'CREDIT CARD (КАРТКА)', shortName: 'Картка', color: '#00a6ff', draw: drawCard },
        { id: 'headphones', name: 'HEADPHONES (НАВУШНИКИ)', shortName: 'Аудіо', color: '#00c3ff', draw: drawHeadphones },
        { id: 'smart-home', name: 'SMART HOME (ДІМ)', shortName: 'Дім', color: '#00e5ff', draw: drawSmartHome },
        { id: 'phone', name: 'SMARTPHONE (СМАРТФОН)', shortName: 'Телефон', color: '#00d2ff', draw: drawPhone },
        { id: 'airplane', name: 'AIRPLANE (ЛІТАК)', shortName: 'Літак', color: '#00b4d8', draw: drawAirplane },
        { id: 'cart', name: 'SHOPPING CART (КОШИК)', shortName: 'Кошик', color: '#0096c7', draw: drawCart },
        { id: 'tv', name: 'TELEVISION (ТЕЛЕВІЗОР)', shortName: 'ТБ', color: '#0077b6', draw: drawTV }
      ];

      // State
      let width = 0, height = 0, dpr = 1;
      let isPlaying = true;
      let speed = 0.5; // Default speed 0.5x
      const BASE_ROTATION_SPEED = (2 * Math.PI) / 6.0;

      let rotationAngle = 0;
      let previousAngle = 0;
      let revolutionCount = 0;

      let currentIconIndex = 0;
      let previousIconIndex = 0;
      let transitionProgress = 1.0;

      let rippleRadius = 0;
      let rippleAlpha = 0;

      let circleRadius = 150;
      let activeCoord = { col: 1, row: 0 };
      let activePos = { x: 0, y: 0 };
      let targetPos = { x: 0, y: 0 };
      let gridOffset = { x: 0, y: 0 };
      let circlesList = [];

      const GRADIENT_STOPS = [
        { stop: 0.00, color: '#00f5d4' },
        { stop: 0.12, color: '#00e676' },
        { stop: 0.24, color: '#aeea00' },
        { stop: 0.36, color: '#ffd600' },
        { stop: 0.48, color: '#ff6d00' },
        { stop: 0.62, color: '#ff1744' },
        { stop: 0.74, color: '#d500f9' },
        { stop: 0.86, color: '#2979ff' },
        { stop: 1.00, color: '#00f5d4' }
      ];

      function init() {
        setupPills();
        setupEventListeners();
        handleResize();
        requestAnimationFrame(renderLoop);
      }

      function setupPills() {
        pillsContainer.innerHTML = '';
        ICONS.forEach((icon, index) => {
          const pill = document.createElement('button');
          pill.className = `icon-pill ${index === currentIconIndex ? 'active' : ''}`;
          pill.textContent = icon.shortName;
          pill.title = icon.name;
          pill.addEventListener('click', () => switchIconTo(index));
          pillsContainer.appendChild(pill);
        });
      }

      function updateActivePill() {
        const pills = pillsContainer.querySelectorAll('.icon-pill');
        pills.forEach((p, idx) => {
          if (idx === currentIconIndex) {
            p.classList.add('active');
          } else {
            p.classList.remove('active');
          }
        });
        currentIconEl.textContent = ICONS[currentIconIndex].name;
        currentIconEl.style.color = ICONS[currentIconIndex].color;
      }

      function handleResize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;

        circleRadius = Math.max(120, Math.min(170, Math.floor(width / 7.5)));
        const centerX = width * 0.5;
        const centerY = height * 0.5;

        gridOffset.x = centerX - circleRadius * 0.8;
        gridOffset.y = centerY;

        updateTargetPos();
        activePos.x = targetPos.x;
        activePos.y = targetPos.y;
      }

      function getCircleCenter(col, row) {
        const dy = circleRadius * Math.sqrt(3);
        const y = gridOffset.y + row * dy;
        const shift = (row % 2 !== 0) ? circleRadius : 0;
        const x = gridOffset.x + col * (2 * circleRadius) + shift;
        return { x, y };
      }

      function updateTargetPos() {
        const p = getCircleCenter(activeCoord.col, activeCoord.row);
        targetPos.x = p.x;
        targetPos.y = p.y;
      }

      function switchIconTo(nextIndex) {
        if (nextIndex === currentIconIndex) return;
        previousIconIndex = currentIconIndex;
        currentIconIndex = nextIndex;
        transitionProgress = 0;
        rippleRadius = 10;
        rippleAlpha = 0.9;
        updateActivePill();
      }

      function setupEventListeners() {
        window.addEventListener('resize', handleResize);

        btnToggle.addEventListener('click', togglePlay);
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          }
        });

        btnNext.addEventListener('click', () => {
          switchIconTo((currentIconIndex + 1) % ICONS.length);
        });
        btnPrev.addEventListener('click', () => {
          switchIconTo((currentIconIndex - 1 + ICONS.length) % ICONS.length);
        });

        btnCenter.addEventListener('click', () => {
          activeCoord = { col: 1, row: 0 };
          updateTargetPos();
        });

        speedSlider.addEventListener('input', (e) => {
          speed = parseFloat(e.target.value);
          speedDisplay.textContent = `${speed.toFixed(1)}x`;
        });

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          let closest = null;
          let minDistance = Infinity;

          for (const c of circlesList) {
            const dx = mouseX - c.x;
            const dy = mouseY - c.y;
            const dist = Math.hypot(dx, dy);
            if (dist <= circleRadius && dist < minDistance) {
              minDistance = dist;
              closest = c;
            }
          }

          if (closest) {
            activeCoord = { col: closest.col, row: closest.row };
            updateTargetPos();
          }
        });
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        iconPause.classList.toggle('hidden', !isPlaying);
        iconPlay.classList.toggle('hidden', isPlaying);
      }

      let lastTimestamp = 0;
      function renderLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const deltaTime = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = timestamp;

        if (isPlaying) {
          previousAngle = rotationAngle;
          rotationAngle += BASE_ROTATION_SPEED * speed * deltaTime;

          const prevTurns = Math.floor(previousAngle / (2 * Math.PI));
          const currTurns = Math.floor(rotationAngle / (2 * Math.PI));

          if (currTurns > prevTurns) {
            revolutionCount += (currTurns - prevTurns);
            revolutionEl.textContent = revolutionCount;
            switchIconTo((currentIconIndex + 1) % ICONS.length);
          }
        }

        const normalizedDeg = Math.floor(((rotationAngle % (2 * Math.PI)) / (2 * Math.PI)) * 360);
        angleDisplayEl.textContent = `${String(normalizedDeg).padStart(3, '0')}°`;

        activePos.x += (targetPos.x - activePos.x) * 0.12;
        activePos.y += (targetPos.y - activePos.y) * 0.12;

        if (transitionProgress < 1.0) {
          transitionProgress = Math.min(1.0, transitionProgress + deltaTime * 2.8);
        }

        if (rippleAlpha > 0.01) {
          rippleRadius += (circleRadius * 1.15 - rippleRadius) * (deltaTime * 4.5);
          rippleAlpha = Math.max(0, rippleAlpha - deltaTime * 1.4);
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        drawScene();
        ctx.restore();

        requestAnimationFrame(renderLoop);
      }

      function drawScene() {
        ctx.fillStyle = '#071738';
        ctx.fillRect(0, 0, width, height);

        const bgGlow = ctx.createRadialGradient(
          activePos.x, activePos.y, circleRadius * 0.3,
          activePos.x, activePos.y, circleRadius * 2.8
        );
        bgGlow.addColorStop(0, 'rgba(13, 42, 107, 0.65)');
        bgGlow.addColorStop(0.6, 'rgba(8, 25, 62, 0.4)');
        bgGlow.addColorStop(1, 'rgba(7, 23, 56, 0)');
        ctx.fillStyle = bgGlow;
        ctx.fillRect(0, 0, width, height);

        generateVisibleCircles();
        drawInterstitialCusps();
        drawCircles();
        drawHexagonalGridLines();

        if (rippleAlpha > 0.01) {
          drawRippleEffect();
        }

        drawConicDashedRing();
        drawActiveIcon();
      }

      function generateVisibleCircles() {
        circlesList = [];
        const R = circleRadius;
        const dy = R * Math.sqrt(3);

        const minRow = Math.floor((-R * 2 - gridOffset.y) / dy) - 1;
        const maxRow = Math.ceil((height + R * 2 - gridOffset.y) / dy) + 1;

        for (let r = minRow; r <= maxRow; r++) {
          const shift = (r % 2 !== 0) ? R : 0;
          const minCol = Math.floor((-R * 2 - gridOffset.x - shift) / (2 * R)) - 1;
          const maxCol = Math.ceil((width + R * 2 - gridOffset.x - shift) / (2 * R)) + 1;

          for (let c = minCol; c <= maxCol; c++) {
            const center = getCircleCenter(c, r);
            circlesList.push({
              col: c, row: r,
              x: center.x, y: center.y,
              isActive: (c === activeCoord.col && r === activeCoord.row)
            });
          }
        }
      }

      function drawInterstitialCusps() {
        const R = circleRadius;
        const circleMap = new Map();
        circlesList.forEach(c => circleMap.set(`${c.col},${c.row}`, c));

        circlesList.forEach(c1 => {
          const c2 = circleMap.get(`${c1.col + 1},${c1.row}`);
          if (!c2) return;

          const topCol = (c1.row % 2 === 0) ? c1.col : c1.col + 1;
          const botCol = (c1.row % 2 === 0) ? c1.col : c1.col + 1;

          const cTop = circleMap.get(`${topCol},${c1.row - 1}`);
          const cBot = circleMap.get(`${botCol},${c1.row + 1}`);

          if (cTop) drawSingleCusp(c1, c2, cTop);
          if (cBot) drawSingleCusp(c1, cBot, c2);
        });
      }

      function drawSingleCusp(C1, C2, C3) {
        const R = circleRadius;
        const gx = (C1.x + C2.x + C3.x) / 3;
        const gy = (C1.y + C2.y + C3.y) / 3;

        const P12 = { x: (C1.x + C2.x) / 2, y: (C1.y + C2.y) / 2 };
        const P23 = { x: (C2.x + C3.x) / 2, y: (C2.y + C3.y) / 2 };
        const P31 = { x: (C3.x + C1.x) / 2, y: (C3.y + C1.y) / 2 };

        const isAdjacentToActive = (C1.isActive || C2.isActive || C3.isActive);

        const a1_start = Math.atan2(P31.y - C1.y, P31.x - C1.x);
        const a1_end = Math.atan2(P12.y - C1.y, P12.x - C1.x);

        const a2_start = Math.atan2(P12.y - C2.y, P12.x - C2.x);
        const a2_end = Math.atan2(P23.y - C2.y, P23.x - C2.x);

        const a3_start = Math.atan2(P23.y - C3.y, P23.x - C3.x);
        const a3_end = Math.atan2(P31.y - C3.y, P31.x - C3.x);

        ctx.beginPath();
        ctx.arc(C1.x, C1.y, R, a1_start, a1_end, false);
        ctx.arc(C2.x, C2.y, R, a2_start, a2_end, false);
        ctx.arc(C3.x, C3.y, R, a3_start, a3_end, false);
        ctx.closePath();

        if (isAdjacentToActive) {
          const distToActive = Math.hypot(gx - activePos.x, gy - activePos.y);
          const intensity = Math.max(0.6, 1.0 - (distToActive / (R * 2.2)));

          const cuspGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, R * 0.7);
          cuspGrad.addColorStop(0, `rgba(0, 110, 255, ${0.95 * intensity})`);
          cuspGrad.addColorStop(0.7, `rgba(0, 85, 230, ${0.85 * intensity})`);
          cuspGrad.addColorStop(1, `rgba(0, 60, 190, ${0.75 * intensity})`);

          ctx.fillStyle = cuspGrad;
          ctx.fill();

          ctx.strokeStyle = `rgba(0, 210, 255, ${0.45 * intensity})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(10, 30, 75, 0.45)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(30, 70, 150, 0.2)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      function drawCircles() {
        const R = circleRadius;
        circlesList.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, R, 0, 2 * Math.PI);

          if (c.isActive) {
            const innerGrad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, R);
            innerGrad.addColorStop(0, '#0c245c');
            innerGrad.addColorStop(0.75, '#091c45');
            innerGrad.addColorStop(1, '#071536');
            ctx.fillStyle = innerGrad;
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 220, 255, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          } else {
            ctx.fillStyle = '#081a3d';
            ctx.fill();

            ctx.strokeStyle = 'rgba(32, 75, 150, 0.35)';
            ctx.lineWidth = 1.0;
            ctx.stroke();
          }
        });
      }

      function drawHexagonalGridLines() {
        const circleMap = new Map();
        circlesList.forEach(c => circleMap.set(`${c.col},${c.row}`, c));

        ctx.save();
        circlesList.forEach(c1 => {
          const c2 = circleMap.get(`${c1.col + 1},${c1.row}`);
          if (!c2) return;

          const topCol = (c1.row % 2 === 0) ? c1.col : c1.col + 1;
          const botCol = (c1.row % 2 === 0) ? c1.col : c1.col + 1;

          const cTop = circleMap.get(`${topCol},${c1.row - 1}`);
          const cBot = circleMap.get(`${botCol},${c1.row + 1}`);

          const p12 = { x: (c1.x + c2.x) / 2, y: (c1.y + c2.y) / 2 };

          if (cTop) {
            const gTop = { x: (c1.x + c2.x + cTop.x) / 3, y: (c1.y + c2.y + cTop.y) / 3 };
            drawHexEdge(gTop, p12, c1.isActive || c2.isActive || cTop.isActive);
          }

          if (cBot) {
            const gBot = { x: (c1.x + c2.x + cBot.x) / 3, y: (c1.y + c2.y + cBot.y) / 3 };
            drawHexEdge(gBot, p12, c1.isActive || c2.isActive || cBot.isActive);
          }
        });
        ctx.restore();
      }

      function drawHexEdge(p1, p2, isNearActive) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);

        if (isNearActive) {
          ctx.strokeStyle = 'rgba(0, 160, 255, 0.4)';
          ctx.lineWidth = 1.2;
        } else {
          ctx.strokeStyle = 'rgba(30, 80, 160, 0.18)';
          ctx.lineWidth = 0.8;
        }
        ctx.stroke();
      }

      function drawRippleEffect() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(activePos.x, activePos.y, rippleRadius, 0, 2 * Math.PI);
        ctx.strokeStyle = `rgba(0, 240, 255, ${rippleAlpha * 0.7})`;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = 'rgba(0, 240, 255, 0.8)';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();
      }

      function drawConicDashedRing() {
        const R = circleRadius;
        const NUM_TICKS = 72;
        const innerR = R - 6;
        const outerR = R + 14;

        ctx.save();
        ctx.translate(activePos.x, activePos.y);

        const conicGrad = ctx.createConicGradient(rotationAngle, 0, 0);
        GRADIENT_STOPS.forEach(s => conicGrad.addColorStop(s.stop, s.color));

        // Glow pass
        ctx.save();
        ctx.shadowColor = 'rgba(0, 220, 255, 0.45)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let i = 0; i < NUM_TICKS; i++) {
          const angle = (i * 2 * Math.PI) / NUM_TICKS + rotationAngle;
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          ctx.moveTo(cos * innerR, sin * innerR);
          ctx.lineTo(cos * outerR, sin * outerR);
        }
        ctx.strokeStyle = conicGrad;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // Crisp pass
        ctx.beginPath();
        for (let i = 0; i < NUM_TICKS; i++) {
          const angle = (i * 2 * Math.PI) / NUM_TICKS + rotationAngle;
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          ctx.moveTo(cos * innerR, sin * innerR);
          ctx.lineTo(cos * outerR, sin * outerR);
        }
        ctx.strokeStyle = conicGrad;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.restore();
      }

      function drawActiveIcon() {
        ctx.save();
        ctx.translate(activePos.x, activePos.y);

        const iconBaseScale = (circleRadius / 150) * 1.25;
        const currentIcon = ICONS[currentIconIndex];
        const prevIcon = ICONS[previousIconIndex];

        if (transitionProgress < 1.0) {
          const ease = easeInOutCubic(transitionProgress);

          ctx.save();
          const prevScale = iconBaseScale * (1.0 - ease * 0.35);
          ctx.scale(prevScale, prevScale);
          ctx.globalAlpha = Math.max(0, 1.0 - ease * 1.5);
          prevIcon.draw(ctx, prevIcon.color);
          ctx.restore();

          ctx.save();
          const newScale = iconBaseScale * (0.65 + ease * 0.35);
          ctx.scale(newScale, newScale);
          ctx.globalAlpha = Math.min(1.0, ease * 1.4);
          currentIcon.draw(ctx, currentIcon.color);
          ctx.restore();
        } else {
          const breathe = 1.0 + Math.sin(Date.now() * 0.003) * 0.02;
          const scale = iconBaseScale * breathe;
          ctx.scale(scale, scale);
          currentIcon.draw(ctx, currentIcon.color);
        }

        ctx.restore();
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      // =========================================================================
      // --- 9 VECTOR ICONS (Canvas Paths) ---
      // =========================================================================

      // 1. CAR (Автомобіль)
      function drawCar(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath(); c.arc(23 - 40, 57 - 40, 6.5, 0, 2 * Math.PI); c.stroke();
        c.beginPath(); c.arc(58 - 40, 57 - 40, 6.5, 0, 2 * Math.PI); c.stroke();

        c.beginPath();
        c.moveTo(16.5 - 40, 57 - 40);
        c.lineTo(12 - 40, 57 - 40);
        c.quadraticCurveTo(7 - 40, 57 - 40, 7 - 40, 51 - 40);
        c.lineTo(7 - 40, 40 - 40);
        c.quadraticCurveTo(7 - 40, 33 - 40, 13 - 40, 31 - 40);
        c.lineTo(22 - 40, 23 - 40);
        c.quadraticCurveTo(28 - 40, 21 - 40, 32 - 40, 21 - 40);
        c.lineTo(45 - 40, 21 - 40);
        c.quadraticCurveTo(52 - 40, 23 - 40, 55 - 40, 28 - 40);
        c.lineTo(61 - 40, 39 - 40);
        c.lineTo(69 - 40, 41 - 40);
        c.quadraticCurveTo(74 - 40, 43 - 40, 74 - 40, 48 - 40);
        c.lineTo(74 - 40, 51 - 40);
        c.quadraticCurveTo(74 - 40, 57 - 40, 69 - 40, 57 - 40);
        c.lineTo(64.5 - 40, 57 - 40);
        c.stroke();

        c.beginPath();
        c.moveTo(29.5 - 40, 57 - 40);
        c.lineTo(51.5 - 40, 57 - 40);
        c.stroke();
        c.restore();
      }

      // 2. CCTV CAMERA (Камера відеоспостереження)
      function drawCCTV(c, color) {
        c.save();
        c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.moveTo(12 - 40, 52 - 40); c.lineTo(12 - 40, 70 - 40);
        c.stroke();

        c.beginPath();
        c.moveTo(12 - 40, 61 - 40); c.lineTo(22 - 40, 61 - 40);
        c.quadraticCurveTo(31 - 40, 57 - 40, 34 - 40, 52 - 40);
        c.lineTo(40 - 40, 43 - 40);
        c.stroke();

        c.save();
        c.translate(46 - 40, 36 - 40);
        c.rotate(-35 * Math.PI / 180);

        c.beginPath();
        c.roundRect(-24, -13, 32, 26, 6);
        c.stroke();

        c.beginPath();
        c.moveTo(8, -9); c.lineTo(21, -15); c.lineTo(21, 15); c.lineTo(8, 9);
        c.stroke();

        c.beginPath();
        c.arc(-8, 0, 2.8, 0, 2 * Math.PI);
        c.fill();
        c.restore();

        c.restore();
      }

      // 3. CREDIT CARD (Банківська / платіжна картка)
      function drawCard(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.roundRect(9 - 40, 19 - 40, 62, 42, 8);
        c.stroke();

        c.beginPath();
        c.moveTo(9 - 40, 32 - 40); c.lineTo(71 - 40, 32 - 40);
        c.stroke();
        c.restore();
      }

      // 4. HEADPHONES (Навушники)
      function drawHeadphones(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.moveTo(17 - 40, 44 - 40);
        c.bezierCurveTo(17 - 40, 20 - 40, 25 - 40, 16 - 40, 40 - 40, 16 - 40);
        c.bezierCurveTo(55 - 40, 16 - 40, 63 - 40, 20 - 40, 63 - 40, 44 - 40);
        c.stroke();

        c.beginPath();
        c.roundRect(11 - 40, 44 - 40, 12, 24, 6);
        c.stroke();

        c.beginPath();
        c.roundRect(57 - 40, 44 - 40, 12, 24, 6);
        c.stroke();
        c.restore();
      }

      // 5. SMART HOME (Розумний дім з Wi-Fi)
      function drawSmartHome(c, color) {
        c.save();
        c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.moveTo(40 - 40, 12 - 40);
        c.lineTo(67 - 40, 34 - 40);
        c.quadraticCurveTo(70 - 40, 39 - 40, 70 - 40, 42 - 40);
        c.lineTo(70 - 40, 63 - 40);
        c.quadraticCurveTo(70 - 40, 70 - 40, 63 - 40, 70 - 40);
        c.lineTo(17 - 40, 70 - 40);
        c.quadraticCurveTo(10 - 40, 70 - 40, 10 - 40, 63 - 40);
        c.lineTo(10 - 40, 42 - 40);
        c.quadraticCurveTo(10 - 40, 36 - 40, 13 - 40, 34 - 40);
        c.closePath();
        c.stroke();

        c.beginPath();
        c.arc(40 - 40, 56 - 40, 2.8, 0, 2 * Math.PI);
        c.fill();

        c.beginPath();
        c.moveTo(30 - 40, 46 - 40);
        c.bezierCurveTo(33 - 40, 40 - 40, 47 - 40, 40 - 40, 50 - 40, 46 - 40);
        c.stroke();

        c.beginPath();
        c.moveTo(22 - 40, 35 - 40);
        c.bezierCurveTo(29 - 40, 25 - 40, 51 - 40, 25 - 40, 58 - 40, 35 - 40);
        c.stroke();
        c.restore();
      }

      // 6. SMARTPHONE (Смартфон)
      function drawPhone(c, color) {
        c.save();
        c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.roundRect(-22, -32, 44, 64, 10);
        c.stroke();

        c.beginPath();
        c.arc(0, 20, 2.8, 0, 2 * Math.PI);
        c.fill();
        c.restore();
      }

      // 7. AIRPLANE (Літак)
      function drawAirplane(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.rotate(Math.PI / 4);
        c.beginPath();
        c.moveTo(0, -28);
        c.bezierCurveTo(3, -28, 4.5, -25, 4.5, -12);
        c.lineTo(27, 6);
        c.bezierCurveTo(29, 8, 28, 10, 25, 10);
        c.lineTo(4.5, 7);
        c.lineTo(3.5, 20);
        c.lineTo(13, 27);
        c.bezierCurveTo(14, 28, 13.5, 29, 12, 29);
        c.lineTo(0, 26);
        c.lineTo(-12, 29);
        c.bezierCurveTo(-13.5, 29, -14, 28, -13, 27);
        c.lineTo(-3.5, 20);
        c.lineTo(-4.5, 7);
        c.lineTo(-25, 10);
        c.bezierCurveTo(-28, 10, -29, 8, -27, 6);
        c.lineTo(-4.5, -12);
        c.bezierCurveTo(-4.5, -25, -3, -28, 0, -28);
        c.closePath();
        c.stroke();
        c.restore();
      }

      // 8. SHOPPING CART (Кошик)
      function drawCart(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath(); c.arc(-12, 24, 4.8, 0, 2 * Math.PI); c.stroke();
        c.beginPath(); c.arc(18, 24, 4.8, 0, 2 * Math.PI); c.stroke();

        c.beginPath();
        c.moveTo(12 - 40, 18 - 40);
        c.lineTo(18 - 40, 18 - 40);
        c.quadraticCurveTo(23 - 40, 18 - 40, 24 - 40, 24 - 40);
        c.lineTo(31 - 40, 52 - 40);
        c.quadraticCurveTo(34 - 40, 56 - 40, 38 - 40, 56 - 40);
        c.lineTo(62 - 40, 56 - 40);
        c.quadraticCurveTo(66 - 40, 56 - 40, 68 - 40, 52 - 40);
        c.lineTo(74 - 40, 25 - 40);
        c.quadraticCurveTo(75 - 40, 22 - 40, 70 - 40, 22 - 40);
        c.lineTo(24 - 40, 22 - 40);
        c.stroke();

        c.beginPath();
        c.moveTo(27 - 40, 36 - 40);
        c.lineTo(71 - 40, 36 - 40);
        c.stroke();
        c.restore();
      }

      // 9. TELEVISION (Телевізор)
      function drawTV(c, color) {
        c.save();
        c.strokeStyle = color; c.lineWidth = 3.6;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = color; c.shadowBlur = 14;

        c.beginPath();
        c.moveTo(0, 28 - 40); c.lineTo(25 - 40, 12 - 40);
        c.moveTo(0, 28 - 40); c.lineTo(55 - 40, 12 - 40);
        c.stroke();

        c.beginPath();
        c.roundRect(-30, -12, 60, 42, 8);
        c.stroke();
        c.restore();
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
